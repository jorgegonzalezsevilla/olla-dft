name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pyflakes qekit tests
      - run: python -m pytest -q
      - run: olla-dft --version && olla-dft selftest

  languages:
    name: multilingual startup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q tests/test_german.py tests/test_languages.py tests/test_startup.py tests/test_portabilidad.py

  kappa:
    # phono3py es un extra opcional, así que el trabajo principal no lo instala
    # y las pruebas que lo necesitan se saltan allí. Sin este trabajo, la
    # conductividad térmica de red se quedaba sin ejecutar en CI entera.
    name: lattice thermal conductivity (optional extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test,kappa]"
      - run: python -m pytest -q tests/test_kappa.py

  package:
    name: build wheel
    runs-on: ubuntu-latest
    needs: [tests, languages, kappa]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
